name: Reachability from a datacenter

# Everything this CLI does, an agent also does — from wherever the agent runs.
# That is often not a laptop: Codespaces, devcontainers, cloud IDEs and CI all
# come from datacenter IP ranges, which bot protection treats far more harshly
# than a home connection. A challenge page is unsolvable for an MCP client, so
# if these endpoints are challenged here, noslopUI is quietly broken for every
# user in one of those environments.
#
# It happened: Cloudflare Bot Fight Mode managed-challenged every request from
# Azure ranges (which is where GitHub's runners live), so the skill download,
# the MCP endpoint and the CLI sign-in were all unreachable for agents running
# anywhere but a laptop. Bot Fight Mode cannot be scoped to a path on the free
# plan, so it was turned off on 2026-09-20 and replaced with a rate-limiting
# rule on /api/*. This job is what proved it, and it blocks now so the same
# thing cannot come back unnoticed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  probe:
    name: can a machine reach noslopui.com
    runs-on: ubuntu-latest
    env:
      MCP_BODY: '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
      START_BODY: '{"clientName":"ci-probe","agents":["claude-code"]}'
      NOSLOPUI_PROBE_KEY: ${{ secrets.NOSLOPUI_PROBE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: probe every endpoint the CLI and an agent depend on
        run: |
          set +e
          fail=0

          # Results go to the job summary as well as the log. A public repo's
          # job LOGS need admin rights to read; its summary is visible to
          # anyone who can see the run, so that is where the answer belongs.
          report() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          probe() {
            name="$1"; shift
            status=$(curl -s -o /tmp/body.txt -D /tmp/head.txt -w '%{http_code}' "$@")
            ray=$(grep -i '^cf-ray:' /tmp/head.txt | tr -d '\r' | cut -d' ' -f2-)
            ctype=$(grep -i '^content-type:' /tmp/head.txt | tr -d '\r' | cut -d' ' -f2- | cut -c1-28)
            challenge=""
            grep -qi 'just a moment' /tmp/body.txt && challenge="  <-- CHALLENGE PAGE"
            report "$(printf '%-26s %-5s %-30s %s%s' "$name" "$status" "$ctype" "$ray" "$challenge")"
            expected="${EXPECT:-2}"
            case "$status" in
              "$expected"*) ;;
              *) fail=$((fail + 1)) ;;
            esac
          }

          report '```'
          report "$(printf '%-26s %-5s %-30s %s' endpoint code content-type cf-ray)"
          report "--------------------------------------------------------------------------------"
          probe "GET /skill/SKILL.md" https://noslopui.com/skill/SKILL.md
          probe "GET /" https://noslopui.com/
          probe "GET /mcp" https://noslopui.com/mcp
          # Every MCP call needs a key or a sign-in (since 2026-09-21), so an
          # unauthenticated call must be a 401 — from us, not from a bot filter.
          EXPECT=401 probe "POST /api/mcp (no key)" -X POST https://noslopui.com/api/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18' -d "$MCP_BODY"
          probe "GET oauth-protected-resource" https://noslopui.com/.well-known/oauth-protected-resource/api/mcp
          probe "GET oauth-authorization-server" https://noslopui.com/.well-known/oauth-authorization-server
          probe "POST /api/cli/auth/start" -X POST https://noslopui.com/api/cli/auth/start -H 'content-type: application/json' -d "$START_BODY"
          report '```'

          # A status code is not the same as a working endpoint — a challenge
          # page can answer with any code. The unauthenticated 401 has to be
          # ours: JSON-RPC, with a WWW-Authenticate that points an MCP client
          # at the OAuth metadata, or no agent can ever sign in.
          head=$(curl -s -o /tmp/mcp.txt -D - -X POST https://noslopui.com/api/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18' -d "$MCP_BODY")
          if printf '%s' "$head" | grep -qi '^www-authenticate: Bearer resource_metadata=' && grep -q '"jsonrpc"' /tmp/mcp.txt; then
            report "MCP answers an unauthenticated call with our own 401 and OAuth discovery."
          else
            report "**MCP's unauthenticated answer isn't ours.** First 200 bytes:"
            report "$(head -c 200 /tmp/mcp.txt | tr -d '\n\r')"
            fail=$((fail + 1))
          fi

          # With a key (a repo secret, when one is set), tools/list must list
          # our real tools.
          if [ -n "$NOSLOPUI_PROBE_KEY" ]; then
            mcp=$(curl -s -X POST https://noslopui.com/api/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18' -H "authorization: Bearer $NOSLOPUI_PROBE_KEY" -d "$MCP_BODY")
            if printf '%s' "$mcp" | grep -q 'search_design_systems'; then
              report "MCP tools/list with a key returned real tools."
            else
              report "**MCP tools/list with a key did not return tools.** First 200 bytes:"
              report "$(printf '%s' "$mcp" | head -c 200 | tr -d '\n\r')"
              fail=$((fail + 1))
            fi
          fi

          if [ "$fail" -gt 0 ]; then
            report "**$fail check(s) failed from this runner.**"
            report "A 'CHALLENGE PAGE' above means bot protection is challenging machine traffic."
            report "An MCP client cannot solve that, so agents in cloud environments cannot reach noslopUI."
            exit 1
          fi
          report "**All endpoints reachable from a datacenter IP.**"
